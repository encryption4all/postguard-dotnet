name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Download the pinned pre-built native library for CI
      - name: Download pg-ffi native library
        run: |
          TAG=$(tr -d '[:space:]' < .github/pg-ffi-version)
          if [ -z "$TAG" ]; then
            echo "::error::.github/pg-ffi-version is empty or missing"
            exit 1
          fi
          echo "Using release: $TAG"
          mkdir -p src/runtimes/linux-x64/native
          gh release download "$TAG" --repo encryption4all/postguard --pattern "pg-ffi-linux-x64.tar.gz" --dir /tmp
          tar xzf /tmp/pg-ffi-linux-x64.tar.gz -C src/runtimes/linux-x64/native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: dotnet build E4A.PostGuard.slnx --configuration Release

      - name: Test
        run: dotnet test E4A.PostGuard.slnx --configuration Release --no-build

      - name: Pack (dry run)
        run: dotnet pack src/E4A.PostGuard.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
          retention-days: 7
